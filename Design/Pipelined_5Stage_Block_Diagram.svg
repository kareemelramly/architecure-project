<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<style>
.blk{fill:#fff;stroke:#1e3a8a;stroke-width:1.6}.reg{fill:#dbeafe;stroke:#1e3a8a;stroke-width:1.8}
.mux{fill:#f1f5f9;stroke:#1e3a8a;stroke-width:1.4}.mem{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
.b4{fill:#ecfdf5;stroke:#059669;stroke-width:1.6}.b3{fill:#fef3c7;stroke:#b45309;stroke-width:1.6}
.w{stroke:#1f2937;stroke-width:1.4;fill:none}.f{stroke:#1d4ed8;stroke-width:1.6;fill:none;stroke-dasharray:6 3}
.o{stroke:#b45309;stroke-width:1.4;fill:none;stroke-dasharray:4 3}.g{stroke:#059669;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
.s{fill:#64748b;font-size:11px}.h{fill:#1e3a8a;font-weight:700;font-size:16px}.hb{font-weight:600}
</style></defs>
<rect width="1600" height="880" fill="#fff"/>
<text x="20" y="30" class="h" font-size="20">femtoRV32 MS3: 5-stage pipeline (IF, ID, EX, MEM, WB), one single-ported memory, one slot every 2 cycles (C0, C1)</text>

<rect x="15" y="60" width="290" height="700" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="25" y="84" class="h">IF (C0)</text>
<rect x="335" y="60" width="370" height="700" fill="#fff" stroke="#cbd5e1"/>
<text x="345" y="84" class="h">ID (C1)</text>
<rect x="735" y="60" width="310" height="700" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="745" y="84" class="h">EX (C0)</text>
<rect x="1075" y="60" width="210" height="700" fill="#fff" stroke="#cbd5e1"/>
<text x="1085" y="84" class="h">MEM (C1)</text>
<rect x="1315" y="60" width="270" height="700" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="1325" y="84" class="h">WB (C0)</text>
<g transform="translate(0,40)">
<rect x="310" y="55" width="20" height="490" class="reg"/>
<text transform="translate(324,300) rotate(-90)" text-anchor="middle" class="hb" font-size="12">IF_ID (load end of C1, flush on redirect or halt)</text>
<rect x="710" y="55" width="20" height="490" class="reg"/>
<text transform="translate(724,300) rotate(-90)" text-anchor="middle" class="hb" font-size="12">ID_EX (load end of C1, flush on stall)</text>
<rect x="1050" y="55" width="20" height="490" class="reg"/>
<text transform="translate(1064,300) rotate(-90)" text-anchor="middle" class="hb" font-size="12">EX_MEM (load end of C0)</text>
<rect x="1290" y="55" width="20" height="490" class="reg"/>
<text transform="translate(1304,300) rotate(-90)" text-anchor="middle" class="hb" font-size="12">MEM_WB (load end of C1)</text>
<rect x="35" y="75" width="70" height="56" class="reg"/>
<text x="70.0" y="99.0" text-anchor="middle" class="hb">PC</text>
<text x="70.0" y="114.0" text-anchor="middle" class="s">load end C1</text>
<rect x="130" y="65" width="50" height="26" class="blk"/>
<text x="155.0" y="82.0" text-anchor="middle" class="hb">+4</text>
<rect x="125" y="160" width="160" height="60" class="b3"/>
<text x="205.0" y="181.0" text-anchor="middle" class="hb">Branch predictor</text>
<text x="205.0" y="196.0" text-anchor="middle" class="s">16-entry BTB + 2-bit BHT</text>
<text x="205.0" y="209.0" text-anchor="middle" class="s">Bonus 3 (BP_ENABLE)</text>
<polygon points="205,55 230,65 230,115 205,125" class="mux"/>
<text x="217.5" y="50" text-anchor="middle" class="s">pred</text>
<polygon points="250,55 275,65 275,115 250,125" class="mux"/>
<text x="262.5" y="50" text-anchor="middle" class="s">next PC</text>
<path d="M105,95 H118 V74 H130" class="w" marker-end="url(#a)"/>
<path d="M180,78 H192 V70 H205" class="w" marker-end="url(#a)"/>
<path d="M118,95 V175 H125" class="w" marker-end="url(#a)"/>
<path d="M200,160 V110 H205" class="o" marker-end="url(#ao)"/>
<path d="M230,90 H250" class="w" marker-end="url(#a)"/>
<path d="M275,90 H292 V30 H22 V100 H35" class="w" marker-end="url(#a)"/>
<rect x="40" y="560" width="1260" height="52" class="mem"/>
<text x="670" y="582" text-anchor="middle" class="hb">Unified memory: one port, byte addressable (Verilog UnifiedMem)</text>
<text x="670" y="600" text-anchor="middle" class="s">address mux: C0 = PC (fetch), C1 = EX_MEM result (load / store). The two never collide, so there is no structural hazard, but every slot takes 2 cycles.</text>
<path d="M70,131 V560" class="w" marker-end="url(#a)"/>
<text x="76" y="520" class="s" text-anchor="start">C0: PC</text>
<path d="M320,560 V545" class="w" marker-end="url(#a)"/>
<text x="326" y="552" class="s" text-anchor="start">instruction, captured in instLatch at end of C0</text>
<path d="M1060,545 V560" class="w" marker-end="url(#a)"/>
<text x="1046" y="556" class="s" text-anchor="end">C1: address, store data</text>
<path d="M1300,560 V545" class="w" marker-end="url(#a)"/>
<text x="1286" y="556" class="s" text-anchor="end">load data (end of C1)</text>
<rect x="360" y="60" width="110" height="40" class="blk"/>
<text x="415.0" y="76.0" text-anchor="middle" class="hb">Control unit</text>
<text x="415.0" y="91.0" text-anchor="middle" class="s">EBREAK = halt</text>
<rect x="360" y="150" width="130" height="70" class="blk"/>
<text x="425.0" y="176.0" text-anchor="middle" class="hb">RegFile</text>
<text x="425.0" y="191.0" text-anchor="middle" class="s">read in C1</text>
<text x="425.0" y="204.0" text-anchor="middle" class="s">write end of C0 + debug port</text>
<rect x="520" y="120" width="100" height="36" class="blk"/>
<text x="570.0" y="142.0" text-anchor="middle" class="hb">ImmGen</text>
<path d="M330,80 H360" class="w" marker-end="url(#a)"/>
<path d="M330,185 H360" class="w" marker-end="url(#a)"/>
<path d="M330,138 H520" class="w" marker-end="url(#a)"/>
<path d="M470,80 H710" class="w" marker-end="url(#a)"/>
<path d="M620,138 H710" class="w" marker-end="url(#a)"/>
<path d="M490,175 H710" class="w" marker-end="url(#a)"/>
<path d="M490,205 H710" class="w" marker-end="url(#a)"/>
<text x="560" y="72" class="s" text-anchor="start">control signals</text>
<rect x="350" y="245" width="345" height="190" fill="#ecfdf5" stroke="#059669" stroke-width="1.4" rx="6"/>
<text x="360" y="262" class="hb" fill="#059669" style="fill:#059669">Bonus 4: branches and jumps resolve in ID</text>
<rect x="360" y="300" width="150" height="52" class="b4"/>
<text x="435.0" y="322.0" text-anchor="middle" class="hb">HazardUnit</text>
<text x="435.0" y="337.0" text-anchor="middle" class="s">load-use and branch stalls</text>
<rect x="520" y="275" width="170" height="44" class="b4"/>
<text x="605.0" y="293.0" text-anchor="middle" class="hb">ID forwarding</text>
<text x="605.0" y="308.0" text-anchor="middle" class="s">EX_MEM result, regWriteData</text>
<rect x="520" y="345" width="170" height="60" class="b4"/>
<text x="605.0" y="371.0" text-anchor="middle" class="hb">Branch comparator</text>
<text x="605.0" y="386.0" text-anchor="middle" class="s">+ JAL / JALR target</text>
<path d="M490,190 H505 V297 H520" class="w" marker-end="url(#a)"/>
<path d="M595,319 V345" class="w" marker-end="url(#a)"/>
<path d="M690,375 H702 V18 H262 V57" class="g" marker-end="url(#ag)"/>
<text x="420" y="12" class="s" text-anchor="start">redirect: PC = resolved target, IF_ID flushed (1 slot lost if mispredicted)</text>
<path d="M430,352 V520 H710" class="g" marker-end="url(#ag)"/>
<text x="440" y="512" class="s" text-anchor="start">stall: hold PC and IF_ID, bubble into ID_EX</text>
<path d="M595,405 V470 H150 V205 H125" class="o" marker-end="url(#ao)"/>
<text x="300" y="462" class="s" text-anchor="start">BP update (resolved branch, in ID)</text>
<polygon points="760,110 784,120 784,160 760,170" class="mux"/>
<text x="772.0" y="105" text-anchor="middle" class="s">fwdA</text>
<polygon points="760,220 784,230 784,270 760,280" class="mux"/>
<text x="772.0" y="215" text-anchor="middle" class="s">fwdB</text>
<polygon points="820,110 844,120 844,160 820,170" class="mux"/>
<text x="832.0" y="105" text-anchor="middle" class="s">PC / rs1</text>
<polygon points="820,220 844,230 844,270 820,280" class="mux"/>
<text x="832.0" y="215" text-anchor="middle" class="s">imm / rs2</text>
<rect x="890" y="90" width="100" height="180" class="blk"/>
<text x="940.0" y="176.0" text-anchor="middle" class="hb">ALU</text>
<text x="940.0" y="191.0" text-anchor="middle" class="s">RV32I + M</text>
<rect x="890" y="300" width="100" height="34" class="blk"/>
<text x="940.0" y="321.0" text-anchor="middle" class="hb">ALU control</text>
<polygon points="1000,150 1024,160 1024,210 1000,220" class="mux"/>
<text x="1012.0" y="145" text-anchor="middle" class="s">result</text>
<path d="M730,130 H760" class="w" marker-end="url(#a)"/>
<path d="M730,240 H760" class="w" marker-end="url(#a)"/>
<path d="M784,140 H820" class="w" marker-end="url(#a)"/>
<path d="M784,250 H820" class="w" marker-end="url(#a)"/>
<path d="M844,140 H890" class="w" marker-end="url(#a)"/>
<path d="M844,250 H890" class="w" marker-end="url(#a)"/>
<path d="M940,300 V270" class="w" marker-end="url(#a)"/>
<path d="M990,185 H1000" class="w" marker-end="url(#a)"/>
<path d="M1024,185 H1050" class="w" marker-end="url(#a)"/>
<path d="M800,250 V360 H1050" class="w" marker-end="url(#a)"/>
<text x="900" y="352" class="s" text-anchor="start">store data (forwarded rs2)</text>
<path d="M745,480 V130 M745,130 H760 M745,240 H760" class="f"/>
<path d="M752,130 H760 M752,240 H760" class="f" marker-end="url(#ab)"/>
<path d="M1050,400 H745" class="f" marker-end="url(#ab)"/>
<path d="M1440,250 V480 H745" class="f" marker-end="url(#ab)"/>
<text x="760" y="472" class="s" text-anchor="start">EX forwarding: EX_MEM result or regWriteData (MEM_WB)</text>
<rect x="1100" y="150" width="160" height="70" class="blk"/>
<text x="1180.0" y="176.0" text-anchor="middle" class="hb">MEM stage (C1)</text>
<text x="1180.0" y="191.0" text-anchor="middle" class="s">load / store use the</text>
<text x="1180.0" y="204.0" text-anchor="middle" class="s">memory port below</text>
<path d="M1070,185 H1100" class="w" marker-end="url(#a)"/>
<path d="M1260,185 H1290" class="w" marker-end="url(#a)"/>
<polygon points="1380,130 1406,140 1406,200 1380,210" class="mux"/>
<text x="1393.0" y="125" text-anchor="middle" class="s">WB mux</text>
<path d="M1310,150 H1380" class="w" marker-end="url(#a)"/>
<path d="M1310,190 H1380" class="w" marker-end="url(#a)"/>
<text x="1318" y="144" class="s" text-anchor="start">mem data</text>
<text x="1318" y="204" class="s" text-anchor="start">ALU result</text>
<path d="M1406,170 H1440 V250" class="w" marker-end="url(#a)"/>
<text x="1412" y="160" class="s" text-anchor="start">regWriteData</text>
<path d="M1440,170 H1500 V655 H20 V235 H380 V220" class="w" marker-end="url(#a)"/>
<text x="900" y="648" class="s" text-anchor="start">write rd at end of C0, before the ID read of the next C1: distance 3 or more needs no forwarding</text>
</g>
<g transform="translate(20,810)"><rect width="1560" height="56" fill="#fff" stroke="#cbd5e1"/>
<rect x="14" y="10" width="22" height="14" class="reg"/><text x="44" y="22">pipeline register / latch</text>
<rect x="230" y="10" width="22" height="14" class="mem"/><text x="260" y="22">shared memory port</text>
<path d="M440,17 H480" class="f"/><text x="490" y="22">EX forwarding</text>
<path d="M620,17 H660" class="g"/><text x="670" y="22">Bonus 4 (ID resolution, stall)</text>
<path d="M880,17 H920" class="o"/><text x="930" y="22">Bonus 3 (predictor update)</text>
<text x="14" y="44" class="s">One slot = 2 clock cycles. PC, IF_ID, ID_EX, MEM_WB load at the end of C1; instLatch, EX_MEM and the RegFile write happen at the end of C0. Latency of one instruction = 5 slots = 10 cycles.</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>